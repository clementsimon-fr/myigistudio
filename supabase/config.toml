[auth]
site_url = "https://myigistudio.vercel.app"
additional_redirect_urls = ["https://myigistudio.vercel.app/**", "http://localhost:8080/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[storage.vector]
enabled = false

[functions.create-guest-account]
verify_jwt = false